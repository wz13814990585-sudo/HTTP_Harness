[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "http-native-harness"
version = "0.1.0.dev0"
description = "HTTP-native agent harness with a durable, policy-controlled kernel"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "HTTP-native Harness contributors" }]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "opentelemetry-exporter-otlp-proto-http>=1.40,<2",
  "opentelemetry-sdk>=1.40,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "openapi-spec-validator>=0.7,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.16,<0.17",
  "types-jsonschema>=4.23,<5",
  "types-pyyaml>=6,<7",
]

[project.scripts]
hnh-contract-check = "hnh.contracts:main"
hnh-dev-worker = "hnh.worker_dev:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hnh"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "docker: requires a real Docker daemon and pinned sandbox image",
  "postgres: requires a real PostgreSQL server",
  "live: requires external credentials or services",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/hnh/transport/http/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hnh"]

[tool.coverage.run]
branch = true
source = ["hnh"]
