name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.21"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev
      - name: Design package validation
        run: uv run python scripts/validate_design.py
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Unit and contract tests
        run: uv run pytest tests/unit tests/contract -q

  postgres-docker-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14.18
        env:
          POSTGRES_DB: hnh_test
          POSTGRES_USER: hnh_test
          POSTGRES_PASSWORD: hnh_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hnh_test -d hnh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HNH_DATABASE_URL: postgresql+psycopg://hnh_test:hnh_ci_only@127.0.0.1:5432/hnh_test
      HNH_TEST_DATABASE_URL: postgresql+psycopg://hnh_test:hnh_ci_only@127.0.0.1:5432/hnh_test
      HNH_TEST_SANDBOX_IMAGE: python@sha256:1dd3dca85e22886e44fcad1bb7ccab6691dfa83db52214cf9e20696e095f3e36
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.21"
          enable-cache: true
      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client libpq-dev
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev
      - name: Pull pinned execution image
        run: docker pull "$HNH_TEST_SANDBOX_IMAGE"
      - name: Migration round-trip and drift
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: PostgreSQL, sandbox, security and chaos regression
        run: uv run pytest --cov --cov-report=term-missing --junitxml=ci-test-results.xml -q
      - name: Acceptance execution gate
        run: uv run python scripts/check_ci_test_report.py ci-test-results.xml reports/acceptance_status.json --spec eval/acceptance_cases.yaml
      - name: Release acceptance gate
        if: startsWith(github.ref, 'refs/tags/')
        run: uv run python scripts/check_ci_test_report.py ci-test-results.xml reports/acceptance_status.json --spec eval/acceptance_cases.yaml --require-release-ready
      - name: Preserve runtime test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-results
          path: ci-test-results.xml
          if-no-files-found: ignore
      - name: Runtime API contract
        run: uv run hnh-contract-check
      - name: Single-node development deployment smoke
        run: bash scripts/check_dev_compose.sh
