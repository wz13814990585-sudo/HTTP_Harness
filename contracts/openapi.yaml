openapi: 3.1.1
info:
  title: HTTP-native Harness Reference API
  version: 0.1.0
  description: Proposed implementation contract, not an already running server. OpenAPI
    3.1.1 is a deliberate compatibility baseline, not a latest-version claim.
servers:
- url: http://127.0.0.1:8080
  description: Planned local deployment
security:
- BearerAuth: []
paths:
  /v1/capabilities:
    get:
      operationId: listCapabilities
      summary: 按授权范围获取稳定顺序能力目录
      description: 按授权范围获取稳定顺序能力目录
      x-hnh-agent-access: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
  /v1/capabilities/{capability_id}:
    get:
      operationId: getCapability
      summary: 按需读取能力契约
      description: 按需读取能力契约
      x-hnh-agent-access: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capability'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: capability_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  /v1/openapi.json:
    get:
      operationId: getOpenAPI
      summary: 获取按权限过滤的接口说明
      description: 获取按权限过滤的接口说明
      x-hnh-agent-access: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
  /v1/conversations:
    post:
      operationId: createConversation
      summary: 创建用户会话
      description: 创建用户会话
      x-hnh-agent-access: false
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreate'
  /v1/conversations/{conversation_id}/messages:
    post:
      operationId: appendMessage
      summary: 追加用户输入；不允许用户声明 system/tool role
      description: 追加用户输入；不允许用户声明 system/tool role
      x-hnh-agent-access: false
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreate'
  /v1/runs:
    post:
      operationId: createRun
      summary: 持久化任务后接受执行
      description: 持久化任务后接受执行
      x-hnh-agent-access: false
      responses:
        '202':
          description: Durably accepted; not completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
          headers: &id001
            Location:
              description: URI of durably accepted resource
              schema:
                type: string
            Retry-After:
              description: Polling hint in seconds; not permission to replay unsafe
                work
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreate'
  /v1/runs/{run_id}:
    get:
      operationId: getRun
      summary: 查询运行状态，包括失败运行
      description: 查询运行状态，包括失败运行
      x-hnh-agent-access: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  /v1/runs/{run_id}/events:
    get:
      operationId: streamRunEvents
      summary: 订阅已提交事件；断开不取消任务
      description: 订阅已提交事件；断开不取消任务
      x-hnh-agent-access: false
      responses:
        '200':
          description: SSE stream of committed events; data is Event JSON. Expired
            cursor is a 410 before streaming.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: Last-Event-ID
        in: header
        schema:
          type: string
          pattern: ^[0-9]+$
  /v1/runs/{run_id}/event-history:
    get:
      operationId: getRunHistory
      summary: 分页读取同一事件历史
      description: 分页读取同一事件历史
      x-hnh-agent-access: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
  /v1/runs/{run_id}/cancellations:
    post:
      operationId: requestRunCancellation
      summary: 提交取消意图；不承诺已停止外部任务
      description: 提交取消意图；不承诺已停止外部任务
      x-hnh-agent-access: false
      responses:
        '202':
          description: Durably accepted; not completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
          headers: *id001
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelCreate'
  /v1/actions/{action_id}:
    get:
      operationId: getAction
      summary: 查询动作与执行结果
      description: 查询动作与执行结果
      x-hnh-agent-access: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  /v1/input-requests/{input_request_id}:
    get:
      operationId: getInputRequest
      summary: 查询待补充或待审批请求
      description: 查询待补充或待审批请求
      x-hnh-agent-access: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InputRequest'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: input_request_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  /v1/input-requests/{input_request_id}/responses:
    post:
      operationId: respondToInput
      summary: 可信用户提交补充输入或审批
      description: 可信用户提交补充输入或审批
      x-hnh-agent-access: false
      responses:
        '202':
          description: Durably accepted; not completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
          headers: *id001
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: input_request_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InputResponse'
  /v1/execution-sessions:
    post:
      operationId: createExecutionSession
      summary: 为当前运行创建受控 Python 会话
      description: 为当前运行创建受控 Python 会话
      x-hnh-agent-access: true
      responses:
        '202':
          description: Durably accepted; not completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
          headers: *id001
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
  /v1/execution-sessions/{session_id}:
    get:
      operationId: getExecutionSession
      summary: 查询执行会话与 generation
      description: 查询执行会话与 generation
      x-hnh-agent-access: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionSession'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  /v1/execution-sessions/{session_id}/executions:
    post:
      operationId: executePython
      summary: 在已授权隔离环境执行代码
      description: 在已授权隔离环境执行代码
      x-hnh-agent-access: true
      responses:
        '202':
          description: Durably accepted; not completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
          headers: *id001
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              maxLength: 1048576
  /v1/workspaces/{workspace_id}/files/{file_path}:
    get:
      operationId: readWorkspaceFile
      summary: 读取逻辑文件并返回 ETag
      description: 读取逻辑文件并返回 ETag
      x-hnh-agent-access: true
      responses:
        '200':
          description: Raw authorized file content. file_path may contain slash; routing
            and encoding must be tested.
          headers:
            ETag:
              schema:
                type: string
              description: Strong validator for the committed file version
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: file_path
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    put:
      operationId: writeWorkspaceFile
      summary: 有条件地更新受管理文件；本地事务内记录效果
      description: 'Overwrite requires If-Match, create requires If-None-Match: *.
        Exactly one is required. Missing is 428, mismatch is 412. Idempotency receipt
        replay does not repeat the write.'
      x-hnh-agent-access: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRecord'
        default:
          $ref: '#/components/responses/Problem'
        '201':
          description: File created with conditional request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRecord'
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: file_path
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: If-Match
        in: header
        schema:
          type: string
      - name: If-None-Match
        in: header
        schema:
          type: string
          enum:
          - '*'
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              maxLength: 1048576
  /v1/artifacts:
    post:
      operationId: createArtifact
      summary: 保存不可变产物；内容 hash 不证明语义真实性
      description: 保存不可变产物；内容 hash 不证明语义真实性
      x-hnh-agent-access: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
  /v1/artifacts/{artifact_id}:
    get:
      operationId: getArtifact
      summary: 读取产物元信息与可授权访问地址
      description: 读取产物元信息与可授权访问地址
      x-hnh-agent-access: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: artifact_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  /v1/artifacts/{artifact_id}/content:
    get:
      operationId: getArtifactContent
      summary: 读取原始产物内容
      description: 读取原始产物内容
      x-hnh-agent-access: true
      responses:
        '200':
          description: Immutable bytes, authorized before delivery.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            ETag:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: artifact_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  /v1/integrations/{integration_id}/operations/{operation_name}/invocations:
    post:
      operationId: invokeIntegrationOperation
      summary: 调用已注册外部能力；输入按动态能力契约校验
      description: 调用已注册外部能力；输入按动态能力契约校验
      x-hnh-agent-access: true
      responses:
        '202':
          description: Durably accepted; not completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
          headers: *id001
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: operation_name
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
  /v1/actions/{action_id}/reconciliations:
    post:
      operationId: reconcileAction
      summary: 受信任操作员提交外部效果对账证据
      description: 受信任操作员提交外部效果对账证据
      x-hnh-agent-access: false
      responses:
        '202':
          description: Durably accepted; not completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
          headers: *id001
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reconciliation'
components:
  schemas:
    HttpOperation:
      type: object
      properties:
        method:
          type: string
          enum:
          - GET
          - HEAD
          - POST
          - PUT
          - PATCH
          - DELETE
        target:
          type: string
          minLength: 5
          maxLength: 2048
          pattern: ^/v1/[^?#\r\n\\]*$
        query:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 128
              value:
                type: string
                maxLength: 8192
            required:
            - name
            - value
            additionalProperties: false
          maxItems: 64
          default: []
        headers:
          type: object
          properties:
            accept:
              type: string
              maxLength: 8192
              pattern: ^[^\r\n]*$
            content-type:
              type: string
              maxLength: 8192
              pattern: ^[^\r\n]*$
            if-match:
              type: string
              maxLength: 8192
              pattern: ^[^\r\n]*$
            if-none-match:
              type: string
              maxLength: 8192
              pattern: ^[^\r\n]*$
          required: []
          additionalProperties: false
          default: {}
        payload:
          oneOf:
          - type: object
            properties:
              kind:
                const: json
              value: {}
            required:
            - kind
            - value
            additionalProperties: false
          - type: object
            properties:
              kind:
                const: text
              text:
                type: string
                maxLength: 1048576
            required:
            - kind
            - text
            additionalProperties: false
          - type: object
            properties:
              kind:
                const: artifact
              artifact_id:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
            required:
            - kind
            - artifact_id
            additionalProperties: false
      required:
      - method
      - target
      additionalProperties: false
      description: Model proposal only. Relative URI, no secrets or caller identity.
        Runtime route/schema/authorization validation is mandatory.
    Limits:
      type: object
      properties:
        max_model_turns:
          type: integer
          minimum: 1
          maximum: 200
        max_tool_calls:
          type: integer
          minimum: 1
          maximum: 1000
        max_wall_seconds:
          type: integer
          minimum: 1
          maximum: 86400
        max_output_tokens:
          type: integer
          minimum: 1
          maximum: 65536
        max_cost_microunits:
          type: integer
          minimum: 0
      required: []
      additionalProperties: false
    RunCreate:
      type: object
      properties:
        agent_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
        input:
          type: string
          minLength: 1
          maxLength: 65536
        conversation_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
        workspace_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
        artifact_refs:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
          maxItems: 100
        limits:
          $ref: '#/components/schemas/Limits'
      required:
      - agent_id
      - input
      additionalProperties: false
    Accepted:
      type: object
      properties:
        resource_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
        location:
          type: string
          pattern: ^/v1/
      required:
      - resource_id
      - location
      additionalProperties: false
      description: Durably accepted reference, not a success claim. Location response
        header carries the same URI.
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        retry_hint:
          type: string
          enum:
          - never
          - after_delay
          - after_refresh
          - reconcile
          - ask_user
      required:
      - type
      - title
      - status
      - code
      additionalProperties: false
      description: RFC 9457 base fields plus project extensions. Retry hint alone
        never authorizes replay.
    Artifact:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
        media_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        content_url:
          type: string
          pattern: ^/v1/
        source_action_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
        created_at:
          type: string
          format: date-time
      required:
      - id
      - media_type
      - size_bytes
      - sha256
      - content_url
      - created_at
      additionalProperties: false
    Run:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
        status:
          type: string
          enum:
          - queued
          - running
          - waiting_input
          - blocked
          - cancelling
          - succeeded
          - failed
          - cancelled
          - expired
        version:
          type: integer
          minimum: 0
        agent_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
        conversation_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
        parent_run_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
