  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Project authentication. Model-generated requests never supply this
        secret.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
      description: Project-defined persistent idempotency contract, not a claim of
        a finalized RFC.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Expected current strong ETag.
  responses:
    Problem:
      description: Request rejected; inspect code. HTTP status alone does not authorize
        retry.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
